name: AFTS Outbreak Intel Agent

# ==========================================================================
# Reads the NEWS feed, proposes work, and WRITES NOTHING to the register.
#
# The apply step is deliberately a SEPARATE, manually dispatched job. An
# agent that researches and writes in one unattended pass is the failure
# this repo has already had: the gap-finder produced correct-looking rows
# attached to fiche numbers describing a plush toy, a vitamin supplement
# and a mackerel recall, and the publish gate passed all three because the
# URLs resolved.
#
# So: this workflow commits proposals. A human dispatches `apply: true`
# after reading them, and even then the curator re-verifies every one
# against the live source before writing.
#
# Dispatched by FsisScheduler.gs at 09:30 Athens. It briefly carried its own
# cron as well, which meant it ran twice a day; scheduler-watchdog.yml now
# provides the independent check that the dispatch actually happened.
# ==========================================================================

on:
  # NO CRON HERE — dispatched by FsisScheduler.gs only (audit 2026-08-28).
  #
  # This workflow briefly carried its own `schedule:` block as well as a
  # slot in FsisScheduler.gs, so every slot fired twice: once from GitHub,
  # once from Apps Script, both into the fsis-data-writers lane.
  #
  # The cron was added for a good reason — Apps Script is outside version
  # control, and recall-confirm-agent went 400 commits without a run
  # because it was missing from that script and nothing went red. Removing
  # the cron without replacing that safety net would recreate the failure.
  # It is replaced, by something better than a duplicate trigger:
  # .github/workflows/scheduler-watchdog.yml runs on GitHub's OWN cron,
  # reads the commit record, and fails loudly when a workflow the scheduler
  # is supposed to dispatch has gone quiet past its threshold. One
  # dispatcher, one independent auditor.
  workflow_dispatch:
    inputs:
      since_days:
        description: "NEWS lookback window in days"
        required: false
        default: "2"
      url:
        description: "One article URL instead of the feed"
        required: false
      apply:
        description: "true = let the curator write. Read the proposals first."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: fsis-data-writers
  cancel-in-progress: false

jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Athens-hour guard (one fire per day across DST)
        id: guard
        run: |
          HOUR=$(TZ=Europe/Athens date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Set up Python 3.11
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The intel agent runs on the AFTS Qwen VPS. Tailscale is required to
      # reach it; both steps are continue-on-error so that a VPS outage
      # degrades to the Claude fallback rather than failing the workflow —
      # the same lesson as the agent workflows that turned red for a week
      # when the box went down.
      - name: Connect to Tailscale
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          version: latest
      # Fail HERE, by name, when the tailnet does not come up.
      #
      # WHY (audit 2026-09-17, from the reviewer run log)
      # -------------------------------------------------
      # tailscale/github-action retries five times and then lets the job
      # CONTINUE:
      #
      #     Attempt 1 to bring up Tailscale...
      #     backend error: invalid key: API key does not exist
      #     Tailscale up failed. Retrying in 5 seconds...
      #     ... x5
      #
      # The next step then reports "llama-server unreachable after 5 attempts"
      # and the one after it "Searx did not return a results array", and the
      # job dies pointing at two services that are both perfectly healthy.
      # They were never down. They were unroutable, because the runner never
      # joined the tailnet.
      #
      # That misdirection cost six weeks. TAILSCALE_AUTHKEY expired around
      # 9-13 August; reviewer 1 last stamped a row on 2026-08-05 and reviewer
      # 2 on 2026-08-10. Every failure email since said "unreachable", so the
      # diagnosis kept going to the VPS — twice to the point of restarting
      # llama-server, which was answering the whole time.
      #
      # An auth key is valid for at most 90 days, so this WILL happen again.
      # Next time it takes one line to read instead of a week.
      - name: Verify Tailscale actually came up
        run: |
          if ! command -v tailscale >/dev/null 2>&1; then
            echo "::error title=Tailscale binary not on PATH::The tailscale/github-action step did not install the client. Everything downstream will report the VPS as unreachable; it is not."
            exit 1
          fi
          TS_IP=$(tailscale ip -4 2>/dev/null | head -1 || true)
          if [ -z "$TS_IP" ]; then
            echo "::error title=Tailscale did NOT connect — TAILSCALE_AUTHKEY is the first thing to check::The runner is not on the tailnet, so llama-server and Searx are UNROUTABLE, not down. Do not restart the VPS."
            {
              echo "## The runner never joined the tailnet"
              echo ""
              echo "Everything downstream depends on this. Any \"unreachable\""
              echo "message after this point is about ROUTING, not about the"
              echo "VPS. llama-server and Searx are almost certainly fine."
              echo ""
              echo "Scroll up to the **Connect to Tailscale** step and read its"
              echo "last line. The usual one is:"
              echo ""
              echo '```'
              echo "backend error: invalid key: API key does not exist"
              echo '```'
              echo ""
              echo "which means the \`TAILSCALE_AUTHKEY\` secret has expired."
              echo "Auth keys last at most 90 days."
              echo ""
              echo "**Fix (about five minutes):**"
              echo ""
              echo "1. login.tailscale.com/admin/settings/keys -> Generate auth key"
              echo "2. Reusable ON, Ephemeral ON, Pre-approved ON, Tags \`tag:ci\`"
              echo "3. Repo Settings -> Secrets and variables -> Actions ->"
              echo "   \`TAILSCALE_AUTHKEY\` -> Update secret"
              echo "4. Re-run this workflow"
              echo ""
              echo "Nothing was read and nothing was written. The queue is"
              echo "untouched."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Tailscale up: $TS_IP"


      - name: Health-check llama-server
        continue-on-error: true
        env:
          LLAMA_BASE_URL: ${{ secrets.LLAMA_BASE_URL }}
        run: |
          if [ -z "$LLAMA_BASE_URL" ]; then
            echo "LLAMA_BASE_URL not set — will fall back to Claude"; exit 0
          fi
          if curl -sf --max-time 10 "$LLAMA_BASE_URL/models" >/dev/null; then
            echo "✓ self-hosted Qwen reachable"
          else
            echo "⚠ Qwen unreachable — the agent will fall back to Claude"
          fi

      - name: Investigate (writes proposals only)
        if: steps.guard.outputs.run == 'true'
        env:
          LLAMA_BASE_URL: ${{ secrets.LLAMA_BASE_URL }}
          LLAMA_MODEL: ${{ vars.LLAMA_MODEL || 'qwen2.5-7b-instruct' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          ARGS="--since ${{ github.event.inputs.since_days || '2' }}"
          if [ -n "${{ github.event.inputs.url }}" ]; then
            ARGS="--url ${{ github.event.inputs.url }}"
          fi
          python -m pipeline.agents.outbreak_intel $ARGS | tee /tmp/intel.txt

      - name: Curate (dry run — always)
        if: steps.guard.outputs.run == 'true'
        run: |
          LATEST=$(ls -t docs/data/agent-proposals/*-outbreak-intel.json 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then echo "no proposals this run"; exit 0; fi
          python -m pipeline.agents.curator --proposals "$LATEST" | tee /tmp/dry.txt

      - name: Curate (apply — only when explicitly dispatched)
        if: steps.guard.outputs.run == 'true' && github.event.inputs.apply == 'true'
        run: |
          LATEST=$(ls -t docs/data/agent-proposals/*-outbreak-intel.json | head -1)
          python -m pipeline.agents.curator --proposals "$LATEST" --apply | tee /tmp/apply.txt

      - name: Commit proposals and verdicts
        if: steps.guard.outputs.run == 'true'
        env:
          GIT_USER_EMAIL: "fsis-bot@advfood.tech"
          GIT_USER_NAME:  "AFTS Intelligence System"
        run: |
          git config user.email "$GIT_USER_EMAIL"
          git config user.name  "$GIT_USER_NAME"
          # recalls.xlsx and recalls.json are staged too: without them an
          # applied change is computed on the runner and thrown away, which
          # is exactly how weekly-review-latest.json stayed frozen for two
          # weeks. See tests/test_workflow_staging.py.
          git add docs/data/agent-proposals docs/data/recalls.xlsx \
                  docs/data/recalls.json || true
          if git diff --staged --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "Outbreak intel agent $(TZ=Europe/Athens date +%Y-%m-%d): proposals + verdicts"
          for i in 1 2 3; do git push && exit 0; git pull --rebase --autostash || true; done
          exit 1

      - name: Summary
        if: steps.guard.outputs.run == 'true' && always()
        run: |
          { echo "### Outbreak intel"; echo '```'; cat /tmp/intel.txt 2>/dev/null;
            echo '```'; echo "### Curator (dry run)"; echo '```';
            cat /tmp/dry.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
