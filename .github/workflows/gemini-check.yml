name: Gemini Check (RETIRED)

# ═══════════════════════════════════════════════════════════════════════
#  RETIRED 2026-09-30 — operator ruling: pipeline/claude_check.py stays in
#  the repository, but NO code may run it. Review is done by our own agents:
#  recall_url_agent (reviewer 1), recall_review_agent (reviewer 2),
#  recall_confirm_agent (reviewer 3).
#
#  This workflow ran claude_check (or a wrapper that imports it and swaps
#  the model: openrouter_check / gemini_check / the FSIS-LM patch). It is
#  kept as a no-op only so an Apps Script dispatch does not 404 — remove
#  its FsisScheduler.gs entry and delete this file in the GitHub UI.
#  tests/test_nothing_runs_claude_check.py fails if it is ever re-armed.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      skip_days:
        description: "Skip Pending rows older than N days (default 0 = check all)"
        required: false
        default: "0"
      skip_commit:
        description: "true = run but do not commit/push (dry-run)"
        required: false
        default: "false"
      model:
        description: "Override GEMINI_REVIEWER_MODEL (default: gemini-2.5-flash)"
        required: false
        default: ""
      fallback_model:
        description: "Override GEMINI_REVIEWER_FALLBACK_MODEL (default: gemini-2.5-flash-lite)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired — does nothing
        run: |
          echo "::notice title=Retired workflow::claude_check is not run by any workflow (operator ruling 2026-09-30). Remove this entry from FsisScheduler.gs and delete the file."
