# ═══════════════════════════════════════════════════════════════════════
#  MANUAL-DISPATCH ONLY.
#  Triggered EXCLUSIVELY by Apps Script (FsisScheduler.gs).
#  Do NOT add a 'schedule:' block — schedules live in Apps Script so the
#  whole AFTS pipeline shares one source of truth.
# ═══════════════════════════════════════════════════════════════════════

name: Gap Finder Fleet (all registered countries)

# ONE SLOT FOR THE WHOLE FLEET (audit 2026-09-23)
# ===============================================
# Coverage was spread over eight per-region workflows. Whatever the
# reason in each case, the result was the same — 22 of 28 registered
# countries producing nothing:
#
#     at be ch de hu lu nl pl   last run 2026-06-14   Central EU
#     dk fi is no se            last run 2026-05-31   Nordic
#     ba cz ee hr md mk         never ran             East EU
#     eg gh ke                  fully configured, wired to nothing
#
# CORRECTION (2026-09-23, later the same day). This header first said the
# three silent finders "lost their entry in FsisScheduler.gs". THAT WAS
# WRONG, and reading the scheduler disproves it:
#
#     05:30  central_eu_gap_finder.yml      present
#     08:00  scandinavian_gap_finder.yml    present
#     12:45  east_eu_gap_finder.yml         present
#
# All three files exist on main, all three declare workflow_dispatch, and
# all three gates pass immediately on a dispatch, so the Apps Script
# dispatcher gets its 204 and fires them every day. They still commit
# nothing, while Greek, Italian, Spanish, Portuguese and Africa each
# commit ~30 times a month. Their country run_logs stop as whole cohorts
# on a single day — all 8 Central EU at 2026-06-14 with exactly 9 runs
# each, all 5 Nordic at 2026-05-31 — which is a workflow stopping, not
# countries failing.
#
# DIAGNOSED, later the same day, from the Actions logs. It is the push,
# not the run. All three passed safe_push.sh a REGION-named directory:
#
#     scandinavian   docs/data/gap_finder_nordic/
#     east_eu        docs/data/gap_finder_easteu/
#     central_eu     docs/data/gap_finder_centraleu/
#
# The pipeline never creates one — CountryConfig.data_dir is
# f"docs/data/gap_finder_{code}", per COUNTRY. git add is atomic across
# pathspecs, so that one bad argument aborted the whole add and staged
# NOTHING, recalls.xlsx included. safe_push.sh's `git add ... || true`
# swallowed the error, the empty index looked like "No changes to
# commit.", and the workflow went green.
#
# They were running and working the whole time. On 2026-09-23 alone:
# Sweden 10 rejected rows, Norway 2 Pending + 13 rejected (including four
# accepted Listeria recalls), Moldova 7, Czechia 5, Croatia 1, Iceland 2 —
# and zero rows dated 2026-09-23 from any of them in the register.
#
# africa_gap_finder.yml does the same multi-country job and listed its
# countries properly (gap_finder_za/ gap_finder_ng/), which is why Africa
# committed daily while its three siblings committed nothing.
#
# Fixed in those three workflows; safe_push.sh now skips a missing path
# with a warning and fails loudly if the xlsx is dirty while the index is
# empty; tests/test_safe_push_paths_exist.py holds every workflow to it.
# The scheduler was right all along.
#
# eg gh ke ARE a wiring gap, and a real one: they have configs and no
# workflow at all.
#
# What this workflow fixes is the SHAPE of the problem rather than any one
# instance of it — N workflows needing N hand-maintained scheduler entries,
# where a country can be missing, mis-scheduled or quietly broken and the
# schedule still reads as covered. All 19 affected countries are in the
# registry, so the fleet runs them on their shard whatever is wrong with
# their own workflow.
#
# The same bookkeeping produced a quieter tell: africa_gap_finder.yml's
# header lists "Verified & wired: cz hr ee mk md ba" — the EAST EU
# countries, pasted into the wrong file's documentation. Anyone checking
# whether East EU was covered would have read that and concluded it was.
#
# So this workflow keeps no list. tools/fleet_shard.py reads the country
# REGISTRY — true by construction, since a config that does not register
# cannot run — and deals it into seven shards, one per weekday. One
# scheduler slot covers everything, and a new country config joins on its
# next shard with no workflow, default list or Apps Script edit.
#
# WHY SHARDED. 43 countries at the observed ~6 min each is over four
# hours in one job, holding the fsis-data-writers lane and blocking every
# reviewer behind it. Six or seven a day is ~40 min. Every country runs
# weekly: a reduction for the ones that run daily now, and the thing that
# makes room for the ones that run never.
#
# SCHEDULED AT 13:30 ATHENS, DAILY — and the hour is not a free choice.
# tools/fleet_shard.py picks the shard from the UTC weekday, so any slot
# before 03:00 Athens lands on the previous UTC day and runs the wrong
# shard every day, with one shard never running at all. 13:30 Athens is
# 10:30 UTC in summer and 11:30 in winter: same day in both. It also puts
# these rows in front of reviewer slot 2 (15:35 / 16:00 / 16:15) the same
# afternoon instead of leaving them overnight.
#
# NEVER give this a day-of-week restriction in FsisScheduler.gs. The
# sharding is HERE, inside the workflow. A "Mon only" restriction would
# not thin it out — it would delete six of the seven shards and take 37 of
# 43 countries dark while the schedule still showed a gap finder running.
#
# Add ONE entry to FsisScheduler.gs, daily:
#     {day:'*', hour:4, minute:0, workflow:'gap_finder_fleet.yml'}
# and delete the entries for the eight per-region finders it replaces.

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Override: comma-separated codes (blank = today's shard)"
        required: false
        type: string
        default: ''
      shards:
        description: 'Number of shards to deal the fleet into (default 7)'
        required: false
        type: string
        default: '7'
      skip_news:
        description: 'Skip news scraping'
        required: false
        type: boolean
        default: false
      skip_verify:
        description: 'Skip article enrichment'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Run pipeline but do not write to xlsx'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fsis-data-writers
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          version: latest
      - name: Verify Tailscale actually came up
        run: |
          if ! command -v tailscale >/dev/null 2>&1; then
            echo "::error title=Tailscale binary not on PATH::The tailscale/github-action step did not install the client. Everything downstream will report the VPS as unreachable; it is not."
            exit 1
          fi
          TS_IP=$(tailscale ip -4 2>/dev/null | head -1 || true)
          if [ -z "$TS_IP" ]; then
            echo "::error title=Tailscale did NOT connect — TAILSCALE_AUTHKEY is the first thing to check::The runner is not on the tailnet, so llama-server and Searx are UNROUTABLE, not down. Do not restart the VPS."
            {
              echo "## The runner never joined the tailnet"
              echo ""
              echo "Everything downstream depends on this. Any \"unreachable\""
              echo "message after this point is about ROUTING, not about the"
              echo "VPS. llama-server and Searx are almost certainly fine."
              echo ""
              echo "Scroll up to the **Connect to Tailscale** step and read its"
              echo "last line. The usual one is:"
              echo ""
              echo '```'
              echo "backend error: invalid key: API key does not exist"
              echo '```'
              echo ""
              echo "which means the \`TAILSCALE_AUTHKEY\` secret has expired."
              echo "Auth keys last at most 90 days."
              echo ""
              echo "**Fix (about five minutes):**"
              echo ""
              echo "1. login.tailscale.com/admin/settings/keys -> Generate auth key"
              echo "2. Reusable ON, Ephemeral ON, Pre-approved ON, Tags \`tag:ci\`"
              echo "3. Repo Settings -> Secrets and variables -> Actions ->"
              echo "   \`TAILSCALE_AUTHKEY\` -> Update secret"
              echo "4. Re-run this workflow"
              echo ""
              echo "Nothing was read and nothing was written. The queue is"
              echo "untouched."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Tailscale up: $TS_IP"


      # continue-on-error (2026-08-24): a VPS outage is not a workflow
      # failure. Every regional finder hard-exited here, so one unreachable
      # box turned the whole fleet red and buried the real cause. The
      # finder itself reports honestly when the model is unavailable.
      - name: Health-check llama-server on VPS
        continue-on-error: true
        env:
          LLAMA_BASE_URL: ${{ secrets.LLAMA_BASE_URL }}
        run: |
          echo "Pinging $LLAMA_BASE_URL/models..."
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 10 "$LLAMA_BASE_URL/models" > /dev/null; then
              echo "✓ llama-server is reachable"
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying in 5s..."
            sleep 5
          done
          echo "✗ llama-server unreachable — finder will report and exit cleanly"

      - name: Work out today's shard
        id: shard
        run: |
          OVERRIDE="${{ inputs.countries }}"
          SHARDS="${{ inputs.shards }}"
          [ -z "$SHARDS" ] && SHARDS=7
          if [ -n "$OVERRIDE" ]; then
            LIST="$OVERRIDE"
            echo "Override supplied — running: $LIST"
          else
            LIST=$(python -m tools.fleet_shard --shards "$SHARDS")
          fi
          if [ -z "$LIST" ]; then
            echo "::error title=Empty shard::tools.fleet_shard returned no countries. The registry is empty or the import failed — every country would be skipped silently."
            exit 1
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "n=$(echo "$LIST" | tr ',' '\n' | grep -c .)" >> "$GITHUB_OUTPUT"
          {
            echo "## Gap finder fleet — $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M') Athens"
            echo ""
            echo "Today's shard: \`$LIST\`"
            echo ""
            echo "<details><summary>The full week</summary>"
            echo ""
            echo '```'
            python -m tools.fleet_shard --plan --shards "$SHARDS" 2>&1
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run today's countries sequentially
        env:
          LLAMA_BASE_URL: ${{ secrets.LLAMA_BASE_URL }}
          SEARX_URL: ${{ secrets.SEARX_URL }}
        shell: bash
        run: |
          ARGS=""
          if [ "${{ inputs.skip_news }}" = "true" ]; then ARGS="$ARGS --skip-news"; fi
          if [ "${{ inputs.skip_verify }}" = "true" ]; then ARGS="$ARGS --skip-verify"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi

          LIST="${{ steps.shard.outputs.list }}"
          echo "Running ${{ steps.shard.outputs.n }} countries: $LIST"

          OK=""; FAILED=""
          IFS=',' read -ra CODES <<< "$LIST"
          for cc in "${CODES[@]}"; do
            cc=$(echo "$cc" | xargs)
            [ -z "$cc" ] && continue
            echo ""
            echo "======================================================================"
            echo "  STARTING country: $cc"
            echo "======================================================================"
            # A PER-COUNTRY CAP, not just a job cap. Without it one country
            # that hangs eats the budget and every country after it in the
            # shard is skipped with no record — which is indistinguishable,
            # a week later, from never having been scheduled.
            if timeout 12m python -m pipeline.gap_finder.main \
                 --country "$cc" --verbose $ARGS; then
              echo "OK $cc"
              OK="$OK $cc"
            else
              rc=$?
              if [ $rc -eq 124 ]; then
                echo "TIMEOUT $cc (12m cap) — continuing"
              else
                echo "FAILED $cc (exit $rc) — continuing"
              fi
              FAILED="$FAILED $cc"
            fi
          done

          {
            echo ""
            echo "| outcome | countries |"
            echo "|---|---|"
            echo "| completed |${OK:- none} |"
            echo "| failed |${FAILED:- none} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$FAILED" ]; then
            echo "::warning title=Gap finder fleet: some countries failed::$FAILED"
          fi
          # Never fail the job on a per-country failure. The run_log records
          # each exit with its stage, and a red job here would block the
          # commit and lose the countries that DID succeed.
          exit 0

      - name: Upload per-country run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gap-finder-fleet-${{ github.run_id }}
          path: docs/data/gap_finder_*/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit xlsx changes (race-safe)
        if: inputs.dry_run != 'true'
        run: |
          # Its own prefix, watched by tools/dispatch_watchdog.py. Reviewer 1
          # spent weeks invisible because it committed under reviewer 2's
          # prefix; a new workflow does not get to repeat that.
          # Narrowed 2026-09-23 from "docs/data/" to this shard's own
          # directories. The whole tree always exists, so it never hit the
          # missing-path bug that silenced three regional finders — but it
          # would happily stage another workflow's in-flight file, and
          # safe_push's rebase+row-union only protects recalls.xlsx.
          #
          # Listing dirs that do not exist yet is now safe: safe_push.sh
          # skips a missing path with a warning instead of aborting the
          # whole add. A country's first run therefore commits its xlsx
          # rows even though its data dir did not exist when the shard
          # started.
          SHARD_PATHS=""
          for cc in $(echo "${{ steps.shard.outputs.list }}" | tr ',' ' '); do
            SHARD_PATHS="$SHARD_PATHS docs/data/gap_finder_${cc}/"
          done
          bash scripts/safe_push.sh \
            "Gap finder fleet: $(date -u +%Y-%m-%d) shard of ${{ steps.shard.outputs.n }} countries" \
            docs/data/recalls.xlsx $SHARD_PATHS
