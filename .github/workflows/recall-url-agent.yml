      - name: Run review agent
        if: steps.guard.outputs.run == 'true'
        env:
          LLAMA_BASE_URL: ${{ secrets.LLAMA_BASE_URL }}
          SEARX_URL: ${{ secrets.SEARX_URL }}
        run: |
          ARGS=""
          SF="${{ github.event.inputs.source_filter || '' }}"
          [ -n "$SF" ] && ARGS="$ARGS --source-filter $SF"
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ] && ARGS="$ARGS --limit $LIMIT"
          SKIP="${{ github.event.inputs.skip_commit || 'false' }}"
          COMMIT=$([ "$SKIP" = "true" ] && echo false || echo true)
          echo "Running (skip_commit=$SKIP → commit=$COMMIT)"
          python -m pipeline.recall_url_agent \
            --xlsx docs/data/recalls.xlsx \
            --commit "$COMMIT" \
            --time-budget-min 20 \
            $ARGS | tee /tmp/review.log

          {
            echo "## Recall URL Agent (Reviewer 1) — $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M') Athens"
            echo ""
            echo "Mode: **$([ "$COMMIT" = "true" ] && echo 'COMMIT' || echo 'DRY-RUN')**"
            echo ""
            echo '```'
            tail -30 /tmp/review.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit xlsx changes (race-safe)
        if: ${{ github.event.inputs.skip_commit != 'true' }}
        run: |
          if [ -f scripts/safe_push.sh ]; then
            bash scripts/safe_push.sh \
              "Recall review agent: $(date -u +%Y-%m-%d) verified promotions" \
              docs/data/recalls.xlsx
          else
            git config user.name "AFTS Intelligence System (review-agent)"
            git config user.email "fsis-bot@advfood.tech"
            git add docs/data/recalls.xlsx
            git diff --cached --quiet || git commit -m "Recall review agent: $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do git push && break; git pull --rebase; sleep 3; done
          fi
