name: AFTS Scheduler Watchdog

# ==========================================================================
# THIS WORKFLOW HAS ITS OWN CRON, DELIBERATELY — AND MUST KEEP IT.
#
# Do not add this workflow to FsisScheduler.gs. It exists to check that
# FsisScheduler.gs is dispatching, and a watchdog dispatched by the thing it
# watches is not a watchdog.
#
# Every collecting, reviewing and publishing workflow in this repository is
# workflow_dispatch-only and fired by that Apps Script, which is outside
# version control and has no alarm of its own. When it stops dispatching,
# GitHub shows nothing at all: no run fails, because no run happens. The
# Actions tab is green and empty, which is the most expensive kind of green.
#
# It has cost this project twice already — collection at 33% of trailing
# median in the week of 2026-08-21, found by a human reading the weekly
# report; and recall-confirm-agent, the only step in the review chain that
# can publish a row, going 400 commits without a run because it was never
# added to the script.
#
# The alternative fix — give every workflow a GitHub cron as well — was
# tried on 2026-08-28 and removed the same day: it double-fires each slot
# and puts two jobs into the same fsis-data-writers lane. One dispatcher,
# one independent auditor.
# ==========================================================================

on:
  schedule:
    - cron: "0 9 * * *"       # 12:00 Athens EEST
    - cron: "0 10 * * *"      # 12:00 Athens EET (winter)
  workflow_dispatch:
    inputs:
      days:
        description: "How far back to read the commit log"
        required: false
        default: "21"
      warn_only:
        description: "true = report without failing the run"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # WIDENED 2026-09-13 — this guard had never once fired in 34 runs
      # since the workflow's creation (2026-08-28). Its own history shows
      # every scheduled run landing at Athens local time 15:xx-20:xx, never
      # 12:xx: GitHub queues a cron dispatch 3-6 hours late (the same lag
      # documented in daily-review-agent.yml's guard fix), so the one-hour
      # HOUR == "12" check skipped every single fire. The watchdog that
      # exists to catch silent non-execution was itself silently
      # non-executing, the whole time, with a green tick every day.
      #
      # Fix: widen to a window that covers the observed lag off of either
      # DST twin (12:00 or 13:00 Athens + up to ~6h slip). Unlike the
      # data-writer workflows, this job is read-only (permissions:
      # contents: read, no commit step) — so both DST cron lines firing
      # inside the window on the same day just means two audit runs
      # instead of one, which is harmless, not a duplicate-write risk.
      - name: Athens-hour guard (widened catch-up window)
        id: guard
        run: |
          HOUR=$(TZ=Europe/Athens date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$HOUR" -ge 12 ] && [ "$HOUR" -le 20 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Athens hour $HOUR — outside the 12:00-20:00 catch-up window. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout with history
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          # The watchdog reads the commit record, so a shallow clone would
          # make every workflow look like it had never run.
          fetch-depth: 0

      - name: Set up Python 3.11
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit the dispatch record
        if: steps.guard.outputs.run == 'true'
        run: |
          ARGS="--days ${{ github.event.inputs.days || '21' }}"
          if [ "${{ github.event.inputs.warn_only }}" = "true" ]; then
            ARGS="$ARGS --warn-only"
          fi
          python -m tools.dispatch_watchdog $ARGS | tee /tmp/watchdog.txt
        continue-on-error: true

      - name: Job summary
        if: steps.guard.outputs.run == 'true' && always()
        run: |
          {
            echo "## Scheduler watchdog — $(TZ=Europe/Athens date '+%Y-%m-%d %H:%M') Athens"
            echo
            echo '```'
            cat /tmp/watchdog.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if anything is overdue
        if: steps.guard.outputs.run == 'true'
        run: |
          ARGS="--days ${{ github.event.inputs.days || '21' }}"
          if [ "${{ github.event.inputs.warn_only }}" = "true" ]; then
            exit 0
          fi
          python -m tools.dispatch_watchdog $ARGS > /dev/null
