name: FSIS Daily Scrape

# ============================================================================
# Full 66-agency scrape — fires 18:00 ATHENS local time, dispatched by
# FsisScheduler.gs (workflow_dispatch only; no GitHub cron).
#
# ARCHITECTURE (audit 2026-05-07 — strict scrape-to-Pending rule):
#
#   This workflow is SCRAPE-ONLY. Every row it produces lands in Pending.
#   Nothing in this workflow runs Gemini enrichment, Claude review, URL
#   gate, pathogen verification, or merge promotion. Those happen in the
#   scheduled gate/check/merge chain:
#
#       06:00 Athens — gemini-url-gate.yml      (URL gate, 1st pass)
#       07:00 Athens — claude-check.yml         (Claude per-row check)
#       07:30 Athens — merge-master.yml         (Pending -> Recalls)
#       19:00 Athens — gemini-url-gate.yml      (URL gate, 2nd pass — runs
#                                                 ~1h after this scrape)
#       18:30 Athens — merge-master.yml         (post-scrape merge slot)
#
#   The 18:30 merge slot was put on the schedule specifically to flush the
#   Pending rows this 18:00 scrape adds, after the 19:00 url-gate has
#   verified them — so promotion latency is ~3-4 hours from scrape to live.
#
#   Lookback: today + 7 calendar days (SINCE_DAYS=7) to cover FDA
#   publication lag. Manual dispatches
#   can override for backfill.
#
# Pairs with morning-critical-scrape.yml at 04:00 Athens (subset of 13
# high-volume agencies). This workflow is the full fleet.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      since_days:
        description: "Days to look back. Default 7 (today + 7 days back, covers FDA publication lag). Pass 14+ for backfill."
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: fsis-data-writers
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      # DISPATCH-ONLY: this guard can no longer block. The workflow's only
      # trigger is workflow_dispatch, so github.event_name is always
      # "workflow_dispatch" and the first branch always wins. It is kept
      # because every later step keys its `if:` off steps.guard.outputs.run,
      # and because the echoed Athens hour is the one record of WHEN the
      # Apps Script scheduler actually fired — which is the diagnostic that
      # was missing when the fleet went quiet. Do not read it as a guard.
      - name: Athens-time guard (16-20 window for the 18:00 fire)
        id: guard
        run: |
          HOUR=$(TZ=Europe/Athens date +%H)
          echo "dispatched at Athens ${HOUR}:$(TZ=Europe/Athens date +%M)"
          echo "athens_hour=$HOUR"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — running regardless of hour."
          elif [ "$HOUR" -ge "16" ] && [ "$HOUR" -le "20" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 18:xx Athens (now ${HOUR}:xx). Skipping."
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── SELF-HOSTED EXTRACTION (2026-08-14) ──
      # scrapers/_base.py now extracts with the AFTS Qwen VPS first and only
      # falls back to Gemini. Without these two steps llama_client.is_configured()
      # is False, _call_llama raises on its first line, and every scraper silently
      # drops back to the exhausted Gemini key — which is exactly what the
      # 2026-08-14 run did: 65 of 73 scrapers returned 0 recalls, 42 ×
      # RESOURCE_EXHAUSTED, and not one line of llama output.
      #
      # continue-on-error is deliberate: if the VPS is down the run must still
      # proceed on Gemini/OpenAI rather than losing the whole daily scrape.
      - name: Connect to Tailscale
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          version: latest
      # Fail HERE, by name, when the tailnet does not come up.
      #
      # WHY (audit 2026-09-17, from the reviewer run log)
      # -------------------------------------------------
      # tailscale/github-action retries five times and then lets the job
      # CONTINUE:
      #
      #     Attempt 1 to bring up Tailscale...
      #     backend error: invalid key: API key does not exist
      #     Tailscale up failed. Retrying in 5 seconds...
      #     ... x5
      #
      # The next step then reports "llama-server unreachable after 5 attempts"
      # and the one after it "Searx did not return a results array", and the
      # job dies pointing at two services that are both perfectly healthy.
      # They were never down. They were unroutable, because the runner never
      # joined the tailnet.
      #
      # That misdirection cost six weeks. TAILSCALE_AUTHKEY expired around
      # 9-13 August; reviewer 1 last stamped a row on 2026-08-05 and reviewer
      # 2 on 2026-08-10. Every failure email since said "unreachable", so the
      # diagnosis kept going to the VPS — twice to the point of restarting
      # llama-server, which was answering the whole time.
      #
      # An auth key is valid for at most 90 days, so this WILL happen again.
      # Next time it takes one line to read instead of a week.
      - name: Verify Tailscale actually came up
        run: |
          if ! command -v tailscale >/dev/null 2>&1; then
            echo "::error title=Tailscale binary not on PATH::The tailscale/github-action step did not install the client. Everything downstream will report the VPS as unreachable; it is not."
            exit 1
          fi
          TS_IP=$(tailscale ip -4 2>/dev/null | head -1 || true)
          if [ -z "$TS_IP" ]; then
            echo "::error title=Tailscale did NOT connect — TAILSCALE_AUTHKEY is the first thing to check::The runner is not on the tailnet, so llama-server and Searx are UNROUTABLE, not down. Do not restart the VPS."
            {
              echo "## The runner never joined the tailnet"
              echo ""
              echo "Everything downstream depends on this. Any \"unreachable\""
              echo "message after this point is about ROUTING, not about the"
              echo "VPS. llama-server and Searx are almost certainly fine."
              echo ""
              echo "Scroll up to the **Connect to Tailscale** step and read its"
              echo "last line. The usual one is:"
              echo ""
              echo '```'
              echo "backend error: invalid key: API key does not exist"
              echo '```'
              echo ""
              echo "which means the \`TAILSCALE_AUTHKEY\` secret has expired."
              echo "Auth keys last at most 90 days."
              echo ""
              echo "**Fix (about five minutes):**"
              echo ""
              echo "1. login.tailscale.com/admin/settings/keys -> Generate auth key"
              echo "2. Reusable ON, Ephemeral ON, Pre-approved ON, Tags \`tag:ci\`"
              echo "3. Repo Settings -> Secrets and variables -> Actions ->"
              echo "   \`TAILSCALE_AUTHKEY\` -> Update secret"
              echo "4. Re-run this workflow"
              echo ""
              echo "Nothing was read and nothing was written. The queue is"
              echo "untouched."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Tailscale up: $TS_IP"


      - name: Health-check llama-server on VPS
        continue-on-error: true
        env:
          LLAMA_BASE_URL: ${{ secrets.LLAMA_BASE_URL }}
        run: |
          if [ -z "$LLAMA_BASE_URL" ]; then
            echo "LLAMA_BASE_URL not set — extraction will fall back to Gemini"
            exit 0
          fi
          for i in 1 2 3; do
            if curl -sf --max-time 10 "$LLAMA_BASE_URL/models" > /dev/null; then
              echo "✓ llama-server reachable — Qwen will handle extraction"
              exit 0
            fi
            echo "attempt $i/3 failed, retrying in 5s..."; sleep 5
          done
          echo "⚠ llama-server unreachable — falling back to Gemini for this run"

      - name: Scrape full 66-agency fleet to Pending (SCRAPE-ONLY — no AI, no review, no merge)
        if: steps.guard.outputs.run == 'true'
        env:
          # Scrapers that internally use Gemini for HTML extraction still
          # need GEMINI_API_KEY available — that's the scraping mechanism
          # itself, not the post-scrape enrichment pass. SKIP_AI below
          # disables the post-scrape enrichment; it does NOT touch the
          # in-scraper extraction.
          # Self-hosted extraction (primary). Gemini stays as the fallback.
          LLAMA_BASE_URL:    ${{ secrets.LLAMA_BASE_URL }}
          LLAMA_MODEL:       ${{ vars.LLAMA_MODEL || 'qwen2.5-7b-instruct' }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:      ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}

          # Scrape lookback: today + 7 calendar days back (covers FDA
          # publication lag — audit 2026-05-07).
          SINCE_DAYS:   ${{ github.event.inputs.since_days || '7' }}
          MAX_PARALLEL: "8"

          # SCRAPE-ONLY MODE — every row stays in Pending.
          # SKIP_AI=1       → no Gemini enrichment pass
          # SKIP_REVIEW=1   → no URL validation, no pathogen-in-source verify, no Claude review
          # SKIP_PROMOTE=1  → no promote_approved; Recalls untouched
          SKIP_AI:       "1"
          SKIP_REVIEW:   "1"
          SKIP_PROMOTE:  "1"
          SKIP_COMMIT:   "false"

          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GIT_USER_EMAIL: "fsis-bot@advfood.tech"
          GIT_USER_NAME:  "FSIS Bot"
        run: |
          python -m pipeline.run_all

      - name: Upload run log artifact
        if: steps.guard.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: fsis-run-log-${{ github.run_id }}
          path: |
            docs/data/recalls.xlsx
            docs/data/recalls.json
          retention-days: 14

      - name: Summary
        if: steps.guard.outputs.run == 'true' && always()
        run: |
          echo "Daily full-fleet scrape complete — Athens $(TZ=Europe/Athens date)."
          echo "All new rows landed in Pending. The 19:00 gemini-url-gate +"
          echo "18:30 merge-master chain handles promotion."
