name: AFTS Monthly Report

# ==========================================================================
# Runs 1st of every month at 09:00 ATHENS TIME (not UTC).
# Cron is duplicated for DST: one line for EEST (summer, UTC+3) and one
# for EET (winter, UTC+2). A guard step then verifies Athens local hour
# so the "wrong" DST cron exits cleanly.
#
# What it does:
#   1. Detect every month since 2026-03 that is CLOSED (i.e. previous or
#      older) AND missing real stats in docs/data/monthly-index.json.
#   2. For each missing month, call the monthly builder (reads
#      docs/data/recalls.xlsx Recalls sheet only — never Pending, never
#      News) to produce:
#          docs/YYYY-MMM.html       — subscriber HTML (matches March format)
#          docs/YYYY-MMM-all.html   — full-month recalls companion
#          docs/data/monthly-summary-latest.json
#      and refresh docs/data/monthly-index.json.
#   3. Convert the subscriber HTML to PDF → docs/YYYY-MMM.pdf
#      (this is the "George PDF" that gets emailed + shown on the hub).
#   4. Set pdf_url on each newly-built month's index entry so hub.html
#      auto-renders the card on next page load.
#
# NEVER overwrites an existing, already-generated month. If you want to
# rebuild March, manually delete its entry from monthly-index.json first.
# ==========================================================================

on:
  # Scheduling is centralized in Apps Script (FsisScheduler.gs) which
  # dispatches this workflow on the 1st of each month at 09:00 Athens.
  # No internal cron block here — Apps Script is the single source of
  # truth so we never get DST-cron-skip noise in the run history.
  workflow_dispatch:
    inputs:
      force_month_end:
        description: "YYYY-MM-DD: force-build this month (ignores gap check)"
        required: false
      backfill_from:
        description: "YYYY-MM: oldest month to check in gap-fill (default 2026-03)"
        required: false
        default: "2026-03"

permissions:
  contents: write

concurrency:
  group: afts-monthly-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Athens-time guard
        id: guard
        run: |
          HOUR=$(TZ=Europe/Athens date +%H)
          echo "athens_hour=$HOUR"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — running regardless of hour."
          elif [ "$HOUR" -ge "07" ] && [ "$HOUR" -le "13" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Athens 09:xx — running."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 09:xx Athens (currently ${HOUR}:xx). Skipping — the other DST cron will handle it."
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install fonts for marketing PDF (reportlab embeds Liberation Sans)
        if: steps.guard.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gap-fill — build only months missing from monthly-index.json
        if: steps.guard.outputs.run == 'true' && github.event.inputs.force_month_end == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          BACKFILL_FROM:     ${{ github.event.inputs.backfill_from || '2026-03' }}
        run: |
          python -m pipeline.build_missing_monthly_reports \
            --from "$BACKFILL_FROM" \
            --xlsx docs/data/recalls.xlsx \
            --index docs/data/monthly-index.json \
            --builder docs/build_monthly_report_afts.py

      - name: Force-build single month (manual dispatch override)
        if: steps.guard.outputs.run == 'true' && github.event.inputs.force_month_end != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
        run: |
          python docs/build_monthly_report_afts.py \
            --month-end "${{ github.event.inputs.force_month_end }}" \
            --xlsx docs/data/recalls.xlsx

      - name: Build marketing one-pager PDF (public lead magnet on hub.html)
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pipeline.build_monthly_marketing \
            --summary docs/data/monthly-summary-latest.json \
            --out-dir docs/marketing

      - name: Build social cards (LinkedIn / Instagram / X)
        if: steps.guard.outputs.run == 'true'
        run: |
          # Same summary as the marketing one-pager, so the two can never
          # describe different top-10s. These carry NO COUNTS by design: a
          # social post is immutable once published, and a month's totals keep
          # moving for weeks after it closes (July 2026: 294 -> 307 in twelve
          # days). The cards are emailed at 05:00 on the 1st, so they must
          # exist by then — which is why this step lives in the DAY-1 workflow
          # and not only in the day-10 updates check.
          python -m pipeline.build_monthly_social \
            --summary docs/data/monthly-summary-latest.json \
            --out-dir docs/social

      - name: Wire pdf_url into monthly-index.json (so hub auto-renders)
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pipeline.set_pdf_urls \
            --index docs/data/monthly-index.json \
            --docs-dir docs \
          # fsis.advfood.tech, NOT gstoforos.github.io (audit 2026-08-11).
          # This line rewrote all six monthly pdf_url values to the raw
          # Pages host on 2026-08-07 and again on 2026-08-11; every URL the
          # project publishes uses the custom domain, and
          # tests/test_monthly_hub_cards.py fails on the github.io form.
            --site-url "https://fsis.advfood.tech"

      - name: Commit outputs
        if: steps.guard.outputs.run == 'true'
        run: |
          git config --local user.email "fsis-bot@advfood.tech"
          git config --local user.name  "AFTS Intelligence System"
          # Subscriber monthly PDFs decommissioned 2026-05-02 — HTML
          # is the canonical deliverable; subscribers print-to-PDF in
          # their browser if needed. Marketing one-pager PDF stays as
          # the public lead magnet on hub.html.
          # 2026-08-31: social PNG + caption added. build_monthly_social now
          # writes a PNG per card (Instagram and X accept images only, never
          # PDF) and <tag>-caption.txt carrying the ten source links for the
          # image posts. Staging only the PDFs meant both were generated on
          # the runner and discarded — the same "computed and thrown away"
          # failure tests/test_workflow_staging.py exists to catch.
          # AUDIT 2026-09-01 — these were one `git add` with nine pathspecs and
          # a trailing `|| true`. git add is ATOMIC over its pathspec list: one
          # non-matching glob aborts the whole call and stages NOTHING, and the
          # `|| true` then swallowed the error. 'docs/marketing/20*-M*.html'
          # has never matched a file, so on a normal run this staged zero files
          # and the step reported "No monthly-report changes to commit" — the
          # month was rebuilt on the runner and thrown away. Adding each
          # pathspec on its own means a miss costs only that one pattern.
          for _p in 'docs/20*-M*.html' \
                    'docs/marketing/20*-M*.pdf' \
                    'docs/social/20*-M*.pdf' \
                    'docs/social/20*-M*.png' \
                    'docs/social/20*-M*-caption.txt' \
                    'docs/data/monthly-summary-latest.json' \
                    'docs/data/monthly-summary-20*.json' \
                    'docs/data/monthly-index.json'; do
            git add $_p 2>/dev/null || echo "  (no match: $_p)"
          done
          if git diff --staged --quiet; then
            echo "No monthly-report changes to commit."
            exit 0
          fi
          COMMIT_MSG="AFTS Monthly Report build $(TZ=Europe/Athens date +%Y-%m-%d)"
          git commit -m "$COMMIT_MSG"

          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed — pull and retry..."
            git pull --rebase --autostash origin main
            sleep $((attempt * 3))
          done
          echo "ERROR: git push failed after 3 attempts."
          exit 1
