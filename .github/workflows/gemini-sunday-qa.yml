name: FSIS Gemini Sunday QA (RETIRED)

# ═══════════════════════════════════════════════════════════════════════
#  RETIRED 2026-09-30 — operator ruling: "gemini must not be anywhere; my
#  agents have replaced them". This workflow ran Gemini (directly, or via
#  pipeline.url_gate_gemini / gap_finder_gemini / the Gemini-grounded URL
#  repair tools). Review, URL resolution and gap-finding are done by our
#  own agents: recall_url_agent, recall_review_agent, recall_confirm_agent
#  and the gap_finder_fleet.
#
#  Kept as a no-op only so a stray Apps Script dispatch does not 404.
#  DELETE THIS FILE in the GitHub UI. tests/test_no_gemini_anywhere.py
#  fails if any workflow runs a Gemini module or passes a Gemini key.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Audit window in days"
        required: false
        default: "14"
      dry_run:
        description: "Dry run (no commits)"
        required: false
        default: "false"
      no_ai:
        description: "Skip Gemini AI checks (deterministic + API only)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired — does nothing
        run: |
          echo "::notice title=Retired workflow::gemini-sunday-qa.yml is retired (no Gemini, operator ruling 2026-09-30). Delete this file and any FsisScheduler.gs entry for it."
