# ═══════════════════════════════════════════════════════════════════════
#  MANUAL-DISPATCH ONLY.
#  This workflow is triggered EXCLUSIVELY by Apps Script
#  (FsisScheduler.gs → dispatchScheduled).
#  Do NOT add a 'schedule:' block here — schedules live in Apps Script
#  so the entire AFTS AI pipeline shares one source of truth.
# ═══════════════════════════════════════════════════════════════════════

name: English Feeds Collector (FSIS)

# Official-feed collector for English-speaking authorities. Pulls STRUCTURED
# recall data directly from authority APIs (no news scraping, no LLM, no
# Tailscale/VPS needed — classification is local keyword matching).
#
# Batch 5/6/7: UK (FSA), Scotland (FSS), Ireland (FSAI).
# All three are UK/Ireland time (London/Dublin = GMT/BST, same offset).
# Gate job pattern (same clean skip as the EU workflows).

on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated source codes (default = all 3)'
        type: string
        default: 'uk,scotland,ireland'
      max_age_days:
        description: 'Max age in days for kept records'
        type: string
        default: '30'
      dry_run:
        description: 'Run but do not write to xlsx'
        type: boolean
        default: false

env:
  TZ: Europe/London

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — proceeding."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          LONDON_HOUR=$(TZ=Europe/London date +%H)
          echo "Current Europe/London hour: ${LONDON_HOUR}"
          if [ "${LONDON_HOUR}" = "09" ]; then
            echo "It's 09:00 London — proceeding with English-feeds sweep."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Not 09:00 London (other cron line handles current DST)."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  english-feeds:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run English-speaking official feeds
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          AGE="${{ inputs.max_age_days }}"
          if [ -z "$AGE" ]; then AGE="30"; fi

          SOURCES="${{ inputs.sources }}"
          if [ -z "$SOURCES" ]; then SOURCES="uk,scotland,ireland"; fi
          echo "Will run: $SOURCES"

          # ────────────────────────────────────────────────────────────────
          # A FAILING SOURCE MUST FAIL THE RUN (audit 2026-08-07).
          #
          # This loop used to end each source with
          #     || echo "✗ $s failed (continuing)"
          # and nothing else. Continuing past a broken source is right — one
          # dead endpoint should not cost us the other two — but the run then
          # finished GREEN, so a permanently broken source looked identical
          # to a quiet one.
          #
          # That is how a month of UK recalls went missing. pipeline/
          # official_feeds/sources/uk.py queried the FSA API with
          # _sort=-created, which that API ignores; it answered HTTP 200 with
          # its oldest page (2018), every row was dropped downstream as
          # out-of-date-range, and the workflow reported success. Three
          # in-scope recalls were lost, including a Listeria recall the FSA
          # posted publicly.
          #
          # uk.py now raises when the query comes back empty or stale. That
          # is only useful if the raise reaches the run status — so failures
          # are collected and re-raised AFTER every source has had its turn.
          # ────────────────────────────────────────────────────────────────
          FAILED=""
          IFS=',' read -ra LIST <<< "$SOURCES"
          for s in "${LIST[@]}"; do
            s=$(echo "$s" | xargs)
            echo ""
            echo "======================================================================"
            echo "  STARTING source: $s"
            echo "======================================================================"
            if ! python -m pipeline.official_feeds.main --source "$s" --max-age-days "$AGE" $ARGS; then
              echo "✗ $s failed (continuing to the remaining sources)"
              FAILED="$FAILED $s"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo ""
            echo "::error title=Official feed source failed::Source(s) failed:$FAILED"
            echo "Other sources still ran and their rows were written; this step"
            echo "fails so the failure is visible instead of green."
            exit 1
          fi

      # always(): the step above now EXITS 1 when a source fails, and the
      # default `if` would skip this commit — throwing away the rows the
      # sources that DID work had already written to the workbook. One dead
      # endpoint must not cost us the other two. Commit first, fail after.
      - name: Commit xlsx changes (race-safe)
        if: always() && inputs.dry_run != 'true'
        run: |
          bash scripts/safe_push.sh "English feeds collector: $(date -u +%Y-%m-%d) (UK+Scotland+Ireland)" docs/data/recalls.xlsx