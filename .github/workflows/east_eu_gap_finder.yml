# ═══════════════════════════════════════════════════════════════════════
#  MANUAL-DISPATCH ONLY.
#  This workflow is triggered EXCLUSIVELY by Apps Script
#  (FsisScheduler.gs → dispatchScheduled).
#  Do NOT add a 'schedule:' block here — schedules live in Apps Script
#  so the entire AFTS AI pipeline shares one source of truth.
# ═══════════════════════════════════════════════════════════════════════

name: East EU Gap Finder (FSIS)

# Consolidated workflow for East/Central-East EU countries that publish
# per-recall authority pages the Greece way (verified individually before
# wiring). All currently share CET/CEST (Europe/Prague). Two cron lines for
# DST live in Apps Script; the gate job ensures only the matching DST cron
# triggers the main job (the other shows "Skipped").
#
# Verified & wired:
#   cz  Czechia (SZPI — potravinynapranyri.cz, /Detail.aspx?id=)
#   hr  Croatia (HAPIH — hapih.hr, /opoziv-<slug>/)
#   ee  Estonia (PTA — pta.agri.ee, /<slug>-tagasikutsumine)
#   mk  North Macedonia (FVA — fva.gov.mk, /<id>-povlekuvanje|otpovikuvanje-<slug>)
#   md  Moldova (ANSA — ansa.gov.md, /media/rechemare-retragere/<slug>.html)
#   ba  Bosnia (FSA BiH — fsa.gov.ba, /obavijest-o-povlacenju...<slug>/)
#
# (Additional East EU countries are added here only after their authority is
#  verified to publish per-recall HTML pages — same discipline as Greece.)

on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'Comma-separated country codes (default = all verified)'
        type: string
        default: 'cz,hr,ee,mk,md,ba'
      skip_news:
        description: 'Skip news scraping'
        type: boolean
        default: false
      skip_verify:
        description: 'Skip article enrichment'
        type: boolean
        default: false
      dry_run:
        description: 'Run pipeline but do not write to xlsx'
        type: boolean
        default: false

env:
  TZ: Europe/Prague
  TS_KEY_RENEW_BY: "2026-08-21"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — proceeding."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          PRAGUE_HOUR=$(TZ=Europe/Prague date +%H)
          echo "Current Europe/Prague hour: ${PRAGUE_HOUR}"
          if [ "${PRAGUE_HOUR}" = "21" ]; then
            echo "It's 21:00 Prague — proceeding with East EU sweep."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Not 21:00 Prague (other cron line handles current DST)."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  east-eu-gap-finder:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          version: latest
      # Fail HERE, by name, when the tailnet does not come up.
      #
      # WHY (audit 2026-09-17, from the reviewer run log)
      # -------------------------------------------------
      # tailscale/github-action retries five times and then lets the job
      # CONTINUE:
      #
      #     Attempt 1 to bring up Tailscale...
      #     backend error: invalid key: API key does not exist
      #     Tailscale up failed. Retrying in 5 seconds...
      #     ... x5
      #
      # The next step then reports "llama-server unreachable after 5 attempts"
      # and the one after it "Searx did not return a results array", and the
      # job dies pointing at two services that are both perfectly healthy.
      # They were never down. They were unroutable, because the runner never
      # joined the tailnet.
      #
      # That misdirection cost six weeks. TAILSCALE_AUTHKEY expired around
      # 9-13 August; reviewer 1 last stamped a row on 2026-08-05 and reviewer
      # 2 on 2026-08-10. Every failure email since said "unreachable", so the
      # diagnosis kept going to the VPS — twice to the point of restarting
      # llama-server, which was answering the whole time.
      #
      # An auth key is valid for at most 90 days, so this WILL happen again.
      # Next time it takes one line to read instead of a week.
      - name: Verify Tailscale actually came up
        run: |
          if ! command -v tailscale >/dev/null 2>&1; then
            echo "::error title=Tailscale binary not on PATH::The tailscale/github-action step did not install the client. Everything downstream will report the VPS as unreachable; it is not."
            exit 1
          fi
          TS_IP=$(tailscale ip -4 2>/dev/null | head -1 || true)
          if [ -z "$TS_IP" ]; then
            echo "::error title=Tailscale did NOT connect — TAILSCALE_AUTHKEY is the first thing to check::The runner is not on the tailnet, so llama-server and Searx are UNROUTABLE, not down. Do not restart the VPS."
            {
              echo "## The runner never joined the tailnet"
              echo ""
              echo "Everything downstream depends on this. Any \"unreachable\""
              echo "message after this point is about ROUTING, not about the"
              echo "VPS. llama-server and Searx are almost certainly fine."
              echo ""
              echo "Scroll up to the **Connect to Tailscale** step and read its"
              echo "last line. The usual one is:"
              echo ""
              echo '```'
              echo "backend error: invalid key: API key does not exist"
              echo '```'
              echo ""
              echo "which means the \`TAILSCALE_AUTHKEY\` secret has expired."
              echo "Auth keys last at most 90 days."
              echo ""
              echo "**Fix (about five minutes):**"
              echo ""
              echo "1. login.tailscale.com/admin/settings/keys -> Generate auth key"
              echo "2. Reusable ON, Ephemeral ON, Pre-approved ON, Tags \`tag:ci\`"
              echo "3. Repo Settings -> Secrets and variables -> Actions ->"
              echo "   \`TAILSCALE_AUTHKEY\` -> Update secret"
              echo "4. Re-run this workflow"
              echo ""
              echo "Nothing was read and nothing was written. The queue is"
              echo "untouched."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Tailscale up: $TS_IP"


      # continue-on-error (2026-08-24): a VPS outage is not a workflow
      # failure. Every regional finder hard-exited here, so one unreachable
      # box turned the whole fleet red and buried the real cause. The
      # finder itself reports honestly when the model is unavailable.
      - name: Health-check llama-server on VPS
        continue-on-error: true
        env:
          LLAMA_BASE_URL: ${{ secrets.LLAMA_BASE_URL }}
        run: |
          echo "Pinging $LLAMA_BASE_URL/models..."
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 10 "$LLAMA_BASE_URL/models" > /dev/null; then
              echo "✓ llama-server is reachable"
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying in 5s..."
            sleep 5
          done
          echo "✗ llama-server unreachable — finder will report and exit cleanly"

      - name: Run all verified East EU country pipelines sequentially
        env:
          LLAMA_BASE_URL: ${{ secrets.LLAMA_BASE_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.skip_news }}" = "true" ]; then ARGS="$ARGS --skip-news"; fi
          if [ "${{ inputs.skip_verify }}" = "true" ]; then ARGS="$ARGS --skip-verify"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi

          COUNTRIES="${{ inputs.countries }}"
          if [ -z "$COUNTRIES" ]; then COUNTRIES="cz,hr,ee,mk,md,ba"; fi
          echo "Will run: $COUNTRIES"

          FAILED=""
          IFS=',' read -ra LIST <<< "$COUNTRIES"
          for cc in "${LIST[@]}"; do
            cc=$(echo "$cc" | xargs)
            echo ""
            echo "======================================================================"
            echo "  STARTING country: $cc"
            echo "======================================================================"
            if python -m pipeline.gap_finder.main --country "$cc" --verbose $ARGS; then
              echo "✓ $cc completed"
            else
              echo "✗ $cc failed (continuing)"
              FAILED="$FAILED $cc"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo ""
            echo "WARNING: Some countries failed:$FAILED"
          fi

      - name: Upload per-country artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: east-eu-gap-finder-run-${{ github.run_id }}
          path: |
            docs/data/gap_finder_cz/
            docs/data/gap_finder_hr/
            docs/data/gap_finder_ee/
            docs/data/gap_finder_mk/
            docs/data/gap_finder_md/
            docs/data/gap_finder_ba/
          retention-days: 14

      - name: Commit xlsx changes (race-safe)
        if: inputs.dry_run != 'true'
        run: |
          # PER-COUNTRY PATHS — corrected 2026-09-23.
          #
          # This read "docs/data/gap_finder_gap_finder_easteu/", a REGION name. The
          # pipeline never creates one: CountryConfig.data_dir is
          # f"docs/data/gap_finder_{{code}}", so only per-country dirs
          # exist. git add is atomic across pathspecs, so that one bad
          # argument aborted the whole add and staged NOTHING — including
          # recalls.xlsx, which had this run's recalls in it. safe_push.sh
          # swallowed the error and printed "No changes to commit.", and
          # the workflow went green.
          #
          # Measured on 2026-09-23: this workflow ran, found recalls, and
          # committed nothing. Zero rows dated 2026-09-23 reached the
          # register from it. Every run since the path was introduced did
          # the same.
          #
          # safe_push.sh now skips missing paths with a warning and fails
          # loudly if the xlsx is dirty while the index is empty, so this
          # cannot silently recur. The paths below are correct anyway.
          bash scripts/safe_push.sh "East EU gap finder: $(date -u +%Y-%m-%d) auto-update" docs/data/recalls.xlsx docs/data/gap_finder_cz/ docs/data/gap_finder_hr/ docs/data/gap_finder_ee/ docs/data/gap_finder_mk/ docs/data/gap_finder_md/ docs/data/gap_finder_ba/
